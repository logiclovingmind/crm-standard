# Render Blueprint — free web service for the Standard CRM.
# Deploy: push to a Git repo, then on Render → New → Blueprint, pick this repo.
# Secrets (sync: false) are entered in the Render dashboard on first deploy.
#
# NOTE (free tier): no persistent disk — SQLite resets on every redeploy.
# Fine for demos. For production, upgrade to a paid plan with a persistent disk.

services:
  - type: web
    name: crm-standard
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix client install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: SERVE_CLIENT
        value: "1"

      # --- Secrets (set in Render dashboard) ---
      - key: SESSION_SECRET
        sync: false
      - key: WHATSAPP_BOT_TOKEN
        sync: false

      # --- Apps Script (Calendar sync) ---
      - key: APPS_SCRIPT_WEBAPP_URL
        sync: false
      - key: APPS_SCRIPT_SHARED_SECRET
        sync: false
